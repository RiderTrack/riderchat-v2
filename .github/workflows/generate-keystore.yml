name: Generate Keystore & Secrets

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore ridertrack.keystore \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -alias ridertrack \
            -storepass "ridertrack123" \
            -keypass "ridertrack123" \
            -dname "CN=RiderTrack,OU=Dev,O=RiderTrack,L=Lima,ST=Lima,C=PE"

      - name: Get SHA1 Fingerprint
        run: |
          SHA1=$(keytool -list -v \
            -keystore ridertrack.keystore \
            -alias ridertrack \
            -storepass "ridertrack123" | grep "SHA1:" | head -1 | awk '{print $NF}' | tr -d ':')
          echo "SHA1_CLEAN=$SHA1" >> $GITHUB_ENV
          echo "=== SHA1 Sin dos puntos ==="
          echo "$SHA1"

      - name: Get SHA256 Fingerprint
        run: |
          SHA256=$(keytool -list -v \
            -keystore ridertrack.keystore \
            -alias ridertrack \
            -storepass "ridertrack123" | grep "SHA256:" | head -1 | awk '{print $NF}' | tr -d ':')
          echo "SHA256_CLEAN=$SHA256" >> $GITHUB_ENV
          echo "=== SHA256 Sin dos puntos ==="
          echo "$SHA256"

      - name: Encode Keystore to Base64
        run: |
          KEYSTORE_B64=$(base64 -w 0 ridertrack.keystore)
          echo "KEYSTORE_B64=$KEYSTORE_B64" >> $GITHUB_ENV
          echo "=== KEYSTORE_BASE64 ==="
          echo "$KEYSTORE_B64"

      - name: Upload Keystore as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ridertrack-keystore
          path: ridertrack.keystore
          retention-days: 1

      - name: Display Secrets
        run: |
          echo ""
          echo "=========================================="
          echo "📋 PASOS PARA CONFIGURAR GITHUB SECRETS"
          echo "=========================================="
          echo ""
          echo "1. Ve a: https://github.com/RiderTrack/riderchat-v2/settings/secrets/actions"
          echo ""
          echo "2. Crea estos 4 secrets:"
          echo ""
          echo "   Nombre: ANDROID_KEYSTORE_BASE64"
          echo "   Valor:"
          echo "${{ env.KEYSTORE_B64 }}"
          echo ""
          echo "   Nombre: ANDROID_KEYSTORE_PASSWORD"
          echo "   Valor: ridertrack123"
          echo ""
          echo "   Nombre: ANDROID_KEY_ALIAS"
          echo "   Valor: ridertrack"
          echo ""
          echo "   Nombre: ANDROID_KEY_PASSWORD"
          echo "   Valor: ridertrack123"
          echo ""
          echo "=========================================="
          echo "🔑 SHA1 PARA GOOGLE AUTH (Firebase Console):"
          echo "=========================================="
          echo "${{ env.SHA1_CLEAN }}"
          echo ""
          echo "=========================================="
          echo "🔑 SHA256 PARA GOOGLE AUTH (Firebase Console):"
          echo "=========================================="
          echo "${{ env.SHA256_CLEAN }}"
          echo ""
          echo "=========================================="
          echo "✅ Después de configurar los secrets, borra este"
          echo "   workflow o no lo vuelvas a correr (ya tendrás tu keystore fijo)"
          echo "=========================================="

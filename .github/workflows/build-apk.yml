name: Build APK (Android)

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android licenses (fallback)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build
        env:
          VITE_BASE_PATH: ./

      - name: Install Capacitor CLI
        run: npm install -D @capacitor/cli @capacitor/core @capacitor/android @capacitor/app @capacitor/splash-screen --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android || true

      - name: Upgrade Gradle to 8.7 (fix BouncyCastle Java 21 issue)
        run: |
          # Actualizar gradle-wrapper.properties a Gradle 8.7
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          networkTimeout=10000
          validateDistributionUrl=true
          EOF
          echo "✅ Gradle actualizado a 8.7"

          # Actualizar versión del Android Gradle Plugin (AGP) en build.gradle
          sed -i 's/com.android.tools.build:gradle:[0-9.]+/com.android.tools.build:gradle:8.2.0/g' android/build.gradle android/app/build.gradle 2>/dev/null || true
          echo "✅ Android Gradle Plugin actualizado"

          # Subir compileSdkVersion a 35 (Android 15) para VANILLA_ICE_CREAM
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/g' android/variables.gradle
            sed --i 's/targetSdkVersion = 34/targetSdkVersion = 35/g' android/variables.gradle
            echo "✅ variables.gradle actualizado a SDK 35"
            cat android/variables.gradle
          fi
          # También parchear app/build.gradle por si acaso
          sed -i 's/compileSdk 34/compileSdk 35/g' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle 2>/dev/null || true

          # Parchear build.gradle RAÍZ - forzar BouncyCastle compatible + Kotlin unificado
          cat >> android/build.gradle << 'EOF'

          // Fix BouncyCastle conflict
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.bouncycastle:bcprov-jdk18on:1.74'
                      // Unificar versiones de Kotlin para evitar duplicados
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-reflect:1.8.22'
                  }
              }
          }
          EOF
          echo "✅ build.gradle raíz parcheado (BouncyCastle + Kotlin unificado)"

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Update Android project
        run: npx cap update android || true

      # ═══════════════════════════════════════════════════════════
      # 🔑 FIRMA DE APK CON KEYSTORE PERMANENTE
      # Si ANDROID_KEYSTORE_BASE64 está configurado, usa la key release
      # Si no, usa una key debug (la APK instala encima pero pierde datos)
      # ═══════════════════════════════════════════════════════════

      - name: Check for release keystore
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ "$KEYSTORE_BASE64" != "" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✅ Keystore de release encontrado en secrets"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "⚠️ No hay keystore de release, se usará debug"
          fi

      - name: Decode release keystore
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/ridertrack.keystore
          echo "✅ Keystore de release decodificado"

      - name: Create debug keystore (fallback)
        if: steps.check_keystore.outputs.has_keystore == 'false'
        run: |
          keytool -genkey -v -keystore android/app/ridertrack.keystore \
            -alias ridertrack -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ridertrack -keypass ridertrack \
            -dname "CN=RiderTrack, OU=Dev, O=RiderTrack, L=Lima, ST=Lima, C=PE"
          echo "✅ Keystore debug creado (fallback)"

      - name: Configure signing in app/build.gradle
        run: |
          # Determinar password según si hay keystore de release
          if [ "${{ steps.check_keystore.outputs.has_keystore }}" = "true" ]; then
            STORE_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            STORE_PASS="ridertrack"
            KEY_ALIAS="ridertrack"
            KEY_PASS="ridertrack"
          fi

          # Agregar signingConfigs y release al app/build.gradle
          cat >> android/app/build.gradle << EOF

          // Configuración de firma (generada automáticamente por GitHub Actions)
          android {
              signingConfigs {
                  release {
                      storeFile file('ridertrack.keystore')
                      storePassword '$STORE_PASS'
                      keyAlias '$KEY_ALIAS'
                      keyPassword '$KEY_PASS'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          echo "✅ Configuración de firma agregada a app/build.gradle"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ridertrack' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'ridertrack' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ridertrack' }}

      - name: Rename APK to include date
        run: |
          mkdir -p output
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ]; then
            DATE=$(date +%Y%m%d_%H%M)
            cp "$APK_FILE" "output/RiderChat-V2-${DATE}.apk"
            echo "✅ APK renombrada: RiderChat-V2-${DATE}.apk"
          else
            echo "❌ No se encontró APK en outputs"
            find android/app/build/outputs -name "*.apk" -type f
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiderChat-V2-APK
          path: output/*.apk
          retention-days: 30
